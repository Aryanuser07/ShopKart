services:
  # MongoDB Database Container
  mongodb:
    image: mongo:7.0
    container_name: shopkart-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shopkart
    volumes:
      - mongo-data:/data/db

  # Express API Server Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shopkart-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/shopkart
      MONGODB_URI: mongodb://mongodb:27017/shopkart
      JWT_SECRET: shopkart_production_jwt_secret_key_2026
      JWT_REFRESH_SECRET: shopkart_production_refresh_secret_key_2026
      ADMIN_EMAIL: admin@shopkart.com
    depends_on:
      - mongodb

  # React Frontend Nginx Web Server
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shopkart-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data:
